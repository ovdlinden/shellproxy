name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: 'test/fixtures'
          severity: warning

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bats (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install Bats (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install bats-core

      - name: Make scripts executable
        run: |
          chmod +x dispatch shellproxy install.sh uninstall.sh
          chmod +x lib/*.sh
          chmod +x hooks/*.zsh hooks/*.bash hooks/*.fish

      - name: Create bin directory
        run: mkdir -p bin

      - name: Run tests
        run: bats test/*.bats

  install-test:
    name: Install Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Make install script executable
        run: chmod +x install.sh uninstall.sh

      - name: Test local install
        run: |
          ./install.sh --local --dir /tmp/shellproxy-test <<< "y"
          [ -f /tmp/shellproxy-test/dispatch ]
          [ -f /tmp/shellproxy-test/shellproxy ]
          [ -L /tmp/shellproxy-test/bin/php ]

      - name: Test shellproxy command
        run: |
          export SHELLPROXY_DIR=/tmp/shellproxy-test
          /tmp/shellproxy-test/shellproxy version
          /tmp/shellproxy-test/shellproxy help

      - name: Test uninstall
        run: |
          ./uninstall.sh <<< "y" || true
