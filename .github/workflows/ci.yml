name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: 'test/fixtures'
          severity: warning
          additional_files: 'dispatch shellproxy'

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Install bats (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install bats-core

      - name: Make scripts executable
        run: |
          chmod +x dispatch shellproxy install.sh uninstall.sh
          chmod +x lib/*.sh hooks/*.zsh hooks/*.bash

      - name: Run tests
        run: bats test/*.bats

  install-test:
    name: Install Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Test install
        run: |
          ./install.sh --local
          source ~/.shellproxy/hooks/hook.bash
          type _shellproxy_hook

      - name: Test shellproxy CLI
        run: |
          ~/.shellproxy/shellproxy version
          ~/.shellproxy/shellproxy help

      - name: Test uninstall
        run: |
          ~/.shellproxy/uninstall.sh <<< "y"
          test ! -d ~/.shellproxy
