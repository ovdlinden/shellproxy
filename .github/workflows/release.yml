name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bats
          npm install -g semantic-release @semantic-release/changelog @semantic-release/exec @semantic-release/git

      - name: Make scripts executable
        run: |
          chmod +x dispatch shellproxy install.sh uninstall.sh
          chmod +x lib/*.sh
          mkdir -p bin

      - name: Run tests
        run: bats test/*.bats

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
